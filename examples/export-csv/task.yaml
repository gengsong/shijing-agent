# Same task, two versions of the page.
# Run: npx shijing-agent demo   (or: npx shijing-agent run examples/export-csv/task.yaml)
name: Export the release checklist
goal: Export the task list as a CSV file

targets:
  baseline: ./site/v1/index.html    # original: export hidden in nested menus
  candidate: ./site/v2/index.html   # redesign: Export CSV on the toolbar

success:
  download:
    name: "*.csv"
    equals: ./expected/checklist.csv   # byte-for-byte; both versions must export the same data

maxSteps: 10
viewport: { width: 760, height: 400 }   # compact, so the demo recording is readable
